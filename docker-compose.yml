services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tm_db
      POSTGRES_USER: tm_user
      POSTGRES_PASSWORD: tm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tm_user -d tm_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    volumes:
    - ./log:/app/log
    environment:
      EX: ${EX:-path-traversal-vuln}
      DATABASE_URL: postgresql://tm_user:tm_password@db:5432/tm_db
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
